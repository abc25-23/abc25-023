            <!-- Reservation Form Section -->
<section class="reservation-section container mt-5">
    <h2>Make a Reservation</h2>
    <p>Book your table at Tsholo's Kitchen today!</p>
    
    <form action="#" method="POST">
        <div class="row">
            <!-- Name -->
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <!-- Phone Number -->
            <div class="col-md-6 mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="e.g. +267 7x xxx xxx" required>
            </div>
        </div>

        <div class="row">
            <!-- Date -->
            <div class="col-md-6 mb-3">
                <label for="date" class="form-label">Reservation Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <!-- Time -->
            <div class="col-md-6 mb-3">
                <label for="time" class="form-label">Time</label>
                <input type="time" class="form-control" id="time" name="time" required>
            </div>
        </div>

        <!-- Number of Guests -->
        <div class="mb-3">
            <label for="guests" class="form-label">Number of Guests</label>
            <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" required>
        </div>

        <!-- Special Requests -->
        <div class="mb-3">
            <label for="requests" class="form-label">Special Requests (Allergies, Seating preferences)</label>
            <textarea class="form-control" id="requests" name="requests" rows="3"></textarea>
        </div>
         <!--Submit button-->
        <button type="Submit" class="btn btn-success" >Submit Reservation</button>
    </form>
</section>
